<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Трекер тренировок</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --accent-text: #1e40af;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --radius: 12px;
    --safe-bottom: env(safe-area-inset-bottom, 16px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--bg); color: var(--text); min-height: 100svh; }

  /* TOP BAR */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px 10px; position: sticky; top: 0; z-index: 10; }
  .topbar-title { font-size: 20px; font-weight: 700; }
  .topbar-sub { font-size: 13px; color: var(--text-2); margin-top: 1px; }

  /* TABS */
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; transition: color .15s; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab span { display: block; font-size: 20px; margin-bottom: 2px; }

  /* PANELS */
  .panel { display: none; padding: 16px 16px calc(16px + var(--safe-bottom)); }
  .panel.on { display: block; }

  /* SECTION LABEL */
  .slabel { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

  /* ADD FORM */
  .form-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .field label { font-size: 11px; color: var(--text-2); font-weight: 500; display: block; margin-bottom: 4px; }
  .field input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); -webkit-appearance: none; }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field.full { grid-column: 1 / -1; }
  .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn:active { opacity: .75; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.success { background: var(--success); color: #fff; }
  .btn.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.danger-text { background: transparent; border: 1px solid var(--danger-light); color: var(--danger); }
  .btn.sm { padding: 7px 12px; font-size: 13px; width: auto; border-radius: 7px; }

  /* SESSION EXERCISES */
  .ex-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .ex-name { font-size: 15px; font-weight: 600; }
  .ex-detail { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .ex-del { background: var(--danger-light); color: var(--danger); border: none; border-radius: 7px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
  .ex-del:active { opacity: .7; }

  /* FOOTER ACTIONS */
  .session-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; padding-bottom: calc(12px + var(--safe-bottom)); position: fixed; bottom: 0; left: 0; right: 0; display: none; z-index: 9; }
  .session-footer.show { display: block; }
  .footer-info { font-size: 13px; color: var(--text-2); margin-bottom: 8px; text-align: center; }
  .footer-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-3); }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-text { font-size: 14px; }

  /* HISTORY */
  .workout-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .workout-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: flex-start; }
  .workout-date { font-size: 15px; font-weight: 600; }
  .workout-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .workout-body { border-top: 1px solid var(--border); }
  .workout-ex-row { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .workout-ex-row:last-child { border-bottom: none; }
  .workout-ex-name { color: var(--text); }
  .workout-ex-val { color: var(--text-2); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; }
  .stat-label { font-size: 11px; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); }

  /* CALENDAR */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 16px; }
  .cal-label { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-3); padding: 2px 0; }
  .cal-day { aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; background: var(--border); color: var(--text-2); }
  .cal-day.trained { background: var(--accent); color: #fff; font-weight: 600; }
  .cal-day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-day.empty { background: transparent; }

  /* BADGES */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.blue { background: var(--accent-light); color: var(--accent-text); }
  .badge.green { background: var(--success-light); color: var(--success); }

  /* TOP EX */
  .top-ex-row { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); padding: 11px 14px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; }
  .top-ex-name { font-size: 14px; font-weight: 500; }
  .badges { display: flex; gap: 5px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">💪 Тренировки</div>
  <div class="topbar-sub" id="today-label"></div>
</div>

<div class="tabs">
  <div class="tab on" onclick="showTab('log')"><span>🏋️</span>Тренировка</div>
  <div class="tab" onclick="showTab('history')"><span>📋</span>История</div>
  <div class="tab" onclick="showTab('stats')"><span>📊</span>Статистика</div>
</div>

<!-- LOG -->
<div id="tab-log" class="panel on" style="padding-bottom: calc(90px + env(safe-area-inset-bottom, 16px))">
  <div class="slabel">Добавить упражнение</div>
  <div class="form-card">
    <div class="form-row">
      <div class="field full">
        <label>Упражнение</label>
        <input id="ex-name" type="text" placeholder="Жим лёжа, приседания..." autocomplete="off" list="ex-list">
        <datalist id="ex-list"></datalist>
      </div>
    </div>
    <div class="form-row three">
      <div class="field">
        <label>Подходы</label>
        <input id="ex-sets" type="number" min="1" max="20" value="3" inputmode="numeric">
      </div>
      <div class="field">
        <label>Повторения</label>
        <input id="ex-reps" type="number" min="1" max="100" value="10" inputmode="numeric">
      </div>
      <div class="field">
        <label>Вес, кг</label>
        <input id="ex-weight" type="number" min="0" step="0.5" value="0" inputmode="decimal">
      </div>
    </div>
    <button class="btn primary" onclick="addExercise()">+ Добавить упражнение</button>
  </div>

  <div class="slabel">Текущая тренировка</div>
  <div id="session-list"></div>
  <div id="session-empty" class="empty">
    <div class="empty-icon">🏃</div>
    <div class="empty-text">Добавьте первое упражнение</div>
  </div>
</div>

<!-- FOOTER -->
<div class="session-footer" id="session-footer">
  <div class="footer-info" id="footer-info"></div>
  <div class="footer-btns">
    <button class="btn outline" onclick="clearSession()">Сбросить</button>
    <button class="btn success" onclick="saveWorkout()">✓ Сохранить тренировку</button>
  </div>
</div>

<!-- HISTORY -->
<div id="tab-history" class="panel">
  <div class="slabel">Все тренировки</div>
  <div id="history-list"></div>
  <div id="history-empty" class="empty" style="display:none">
    <div class="empty-icon">📅</div>
    <div class="empty-text">Тренировок пока нет</div>
  </div>
</div>

<!-- STATS -->
<div id="tab-stats" class="panel">
  <div class="slabel">Активность (4 недели)</div>
  <div class="cal-grid" id="cal-grid"></div>

  <div class="slabel">Общая статистика</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Всего тренировок</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat-card"><div class="stat-label">За этот месяц</div><div class="stat-val" id="s-month">0</div></div>
    <div class="stat-card"><div class="stat-label">Серия подряд 🔥</div><div class="stat-val" id="s-streak">0</div></div>
    <div class="stat-card"><div class="stat-label">Объём всего, кг</div><div class="stat-val" id="s-vol">0</div></div>
  </div>

  <div class="slabel">Топ упражнений</div>
  <div id="top-ex-list"></div>
  <div id="top-ex-empty" class="empty" style="display:none">
    <div class="empty-text">Данных пока нет</div>
  </div>
</div>

<script>
const KEY = 'wt_data_v1';
let session = [];
let workouts = [];

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); workouts = d.workouts || []; }
  } catch(e) {}
}

function saveData() {
  try { localStorage.setItem(KEY, JSON.stringify({ workouts })); } catch(e) {}
}

function updateDateLabel() {
  const now = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  document.getElementById('today-label').textContent = now.toLocaleDateString('ru-RU', opts);
}

function updateSuggestions() {
  const names = [...new Set(workouts.flatMap(w => w.exercises.map(e => e.name)))];
  document.getElementById('ex-list').innerHTML = names.map(n => `<option value="${n}">`).join('');
}

function addExercise() {
  const name = document.getElementById('ex-name').value.trim();
  const sets = parseInt(document.getElementById('ex-sets').value) || 1;
  const reps = parseInt(document.getElementById('ex-reps').value) || 1;
  const weight = parseFloat(document.getElementById('ex-weight').value) || 0;
  if (!name) { document.getElementById('ex-name').focus(); return; }
  session.push({ name, sets, reps, weight, id: Date.now() });
  document.getElementById('ex-name').value = '';
  renderSession();
}

function removeExercise(id) {
  session = session.filter(e => e.id !== id);
  renderSession();
}

function renderSession() {
  const list = document.getElementById('session-list');
  const empty = document.getElementById('session-empty');
  const footer = document.getElementById('session-footer');

  if (!session.length) {
    list.innerHTML = '';
    empty.style.display = '';
    footer.classList.remove('show');
    return;
  }
  empty.style.display = 'none';
  footer.classList.add('show');

  list.innerHTML = session.map(e => `
    <div class="ex-card">
      <div>
        <div class="ex-name">${e.name}</div>
        <div class="ex-detail">${e.sets} подх. × ${e.reps} повт.${e.weight > 0 ? ' · ' + e.weight + ' кг' : ''}</div>
      </div>
      <button class="ex-del" onclick="removeExercise(${e.id})">✕</button>
    </div>`).join('');

  const vol = session.reduce((s, e) => s + e.sets * e.reps * e.weight, 0);
  document.getElementById('footer-info').textContent =
    `${session.length} упр. · объём ${Math.round(vol).toLocaleString()} кг`;
}

function clearSession() {
  if (!confirm('Сбросить текущую тренировку?')) return;
  session = [];
  renderSession();
}

function saveWorkout() {
  if (!session.length) return;
  workouts.unshift({ id: Date.now(), date: new Date().toISOString(), exercises: session.slice() });
  session = [];
  saveData();
  updateSuggestions();
  renderSession();
  renderHistory();
  renderStats();
  alert('Тренировка сохранена! 💪');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  const empty = document.getElementById('history-empty');
  if (!workouts.length) { list.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  list.innerHTML = workouts.map(w => {
    const d = new Date(w.date);
    const dateStr = d.toLocaleDateString('ru-RU', { weekday:'short', day:'numeric', month:'long' });
    const timeStr = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
    const vol = Math.round(w.exercises.reduce((s, e) => s + e.sets * e.reps * e.weight, 0));
    return `
      <div class="workout-card">
        <div class="workout-head">
          <div>
            <div class="workout-date">${dateStr}, ${timeStr}</div>
            <div class="workout-meta">${w.exercises.length} упр. · ${vol.toLocaleString()} кг</div>
          </div>
          <button class="btn outline sm" onclick="deleteWorkout(${w.id})">Удалить</button>
        </div>
        <div class="workout-body">
          ${w.exercises.map(e => `
            <div class="workout-ex-row">
              <span class="workout-ex-name">${e.name}</span>
              <span class="workout-ex-val">${e.sets}×${e.reps}${e.weight > 0 ? ' · ' + e.weight + 'кг' : ''}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function deleteWorkout(id) {
  if (!confirm('Удалить тренировку?')) return;
  workouts = workouts.filter(w => w.id !== id);
  saveData();
  renderHistory();
  renderStats();
}

function renderStats() {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('s-total').textContent = workouts.length;
  document.getElementById('s-month').textContent = workouts.filter(w => new Date(w.date) >= monthStart).length;

  const vol = workouts.reduce((s, w) => s + w.exercises.reduce((es, e) => es + e.sets * e.reps * e.weight, 0), 0);
  document.getElementById('s-vol').textContent = Math.round(vol).toLocaleString();

  const today = new Date(); today.setHours(0,0,0,0);
  const days = new Set(workouts.map(w => { const d = new Date(w.date); d.setHours(0,0,0,0); return d.getTime(); }));
  let streak = 0, check = new Date(today);
  while (days.has(check.getTime())) { streak++; check.setDate(check.getDate() - 1); }
  document.getElementById('s-streak').textContent = streak + ' дн.';

  const grid = document.getElementById('cal-grid');
  const labels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let html = labels.map(l => `<div class="cal-label">${l}</div>`).join('');
  const start = new Date(today); start.setDate(start.getDate() - 27);
  const dow = (start.getDay() + 6) % 7;
  for (let i = 0; i < dow; i++) html += '<div class="cal-day empty"></div>';
  for (let i = 0; i < 28; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i); d.setHours(0,0,0,0);
    const isToday = d.getTime() === today.getTime();
    const trained = days.has(d.getTime());
    html += `<div class="cal-day${trained ? ' trained' : ''}${isToday ? ' today' : ''}">${d.getDate()}</div>`;
  }
  grid.innerHTML = html;

  const exMap = {};
  workouts.forEach(w => w.exercises.forEach(e => {
    if (!exMap[e.name]) exMap[e.name] = { count: 0, maxWeight: 0 };
    exMap[e.name].count++;
    if (e.weight > exMap[e.name].maxWeight) exMap[e.name].maxWeight = e.weight;
  }));
  const sorted = Object.entries(exMap).sort((a, b) => b[1].count - a[1].count).slice(0, 6);
  const topEl = document.getElementById('top-ex-list');
  const topEmpty = document.getElementById('top-ex-empty');
  if (!sorted.length) { topEl.innerHTML = ''; topEmpty.style.display = ''; return; }
  topEmpty.style.display = 'none';
  topEl.innerHTML = sorted.map(([name, data]) => `
    <div class="top-ex-row">
      <div class="top-ex-name">${name}</div>
      <div class="badges">
        <span class="badge blue">${data.count}×</span>
        ${data.maxWeight > 0 ? `<span class="badge green">${data.maxWeight}кг</span>` : ''}
      </div>
    </div>`).join('');
}

function showTab(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('tab-' + id).classList.add('on');
  event.target.classList.add('on');
  if (id === 'history') renderHistory();
  if (id === 'stats') renderStats();
}

// INIT
loadData();
updateDateLabel();
updateSuggestions();
renderSession();
renderHistory();
renderStats();
</script>
</body>
</html>
